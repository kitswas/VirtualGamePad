{{ define "main" }}
<article class="page post">
    <header>
        <h1>{{ .Title }}</h1>
        <div class="post-meta">
            {{ if not .Date.IsZero }}
            <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            {{ end }}
            <span class="post-reading-time">{{ .ReadingTime }} min read</span>
        </div>
        {{ if .Params.toc }}
        <div class="toc toc-inline">
            <h2>{{ i18n "toc_title" }}</h2>
            {{ .TableOfContents }}
        </div>
        {{ end }}
    </header>
    <div class="page-content">
        {{ .Content }}
    </div>
</article>
{{ end }}
